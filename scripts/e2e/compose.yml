services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kz_e2e
      POSTGRES_USER: kz_e2e
      POSTGRES_PASSWORD: ${KZ_E2E_TOKEN:?}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kz_e2e", "-d", "kz_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ${KZ_E2E_API_CHECKOUT:?}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/kz_e2e
      POSTGRES_USER: kz_e2e
      POSTGRES_PASSWORD: ${KZ_E2E_TOKEN:?}
      ADMIN_BEARER_KEY: ${KZ_E2E_TOKEN:?}
      R2_ENDPOINT: https://unused.invalid
      R2_ACCESS_KEY_ID: e2e
      R2_SECRET_ACCESS_KEY: ${KZ_E2E_TOKEN:?}
      R2_BUCKET: kz-e2e
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${KZ_E2E_RUNTIME:?}/server.pem:/etc/nginx/server.pem:ro
      - ${KZ_E2E_RUNTIME:?}/server.key:/etc/nginx/server.key:ro
    depends_on:
      api:
        condition: service_healthy

  game:
    image: ${KZ_E2E_GAME_IMAGE:?}
    tty: true
    environment:
      KZ_E2E_TOKEN: ${KZ_E2E_TOKEN:?}
    volumes:
      - ${KZ_E2E_RUNTIME:?}/game:/run/kz-e2e:ro
      - ./kz_e2e.sma:/opt/kz-e2e/kz_e2e.sma:ro
      - ../../addons/amxmodx/scripting/include:/opt/kz-e2e/include:ro
