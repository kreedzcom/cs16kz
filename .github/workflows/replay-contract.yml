name: Replay contract

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kreedzcom/kz-global-api
          ref: a092139ba6fc69eda20b9514f6ac0d5be0530046
          path: companion-api
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - name: Install contract test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev zlib1g-dev lib32stdc++6
      - name: Validate native replay chunks with the backend
        run: bash scripts/verify-replay-contract.sh companion-api
      - name: Compile Pawn smoke plugin
        shell: bash
        run: |
          amxx="$RUNNER_TEMP/amxx-pawn"
          mkdir -p "$amxx"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/alliedmodders/amxmodx/releases/download/1.10.0.5488/amxmodx-1.10.0-git5488-base-linux.tar.gz \
            --output "$amxx/base.tar.gz"
          echo "b537f5c5972294afcd5b022e5ffc44627738dfb029ad1b2eab5dc482c8812391  $amxx/base.tar.gz" | sha256sum --check
          tar -xzf "$amxx/base.tar.gz" -C "$amxx"
          scripting="$amxx/addons/amxmodx/scripting"
          cp addons/amxmodx/scripting/include/*.inc "$scripting/include/"
          cp addons/amxmodx/scripting/kz_global_api_tests.sma "$scripting/"
          cd "$scripting"
          LD_LIBRARY_PATH="$scripting" ./amxxpc kz_global_api_tests.sma -okz_global_api_tests.amxx
          test -s kz_global_api_tests.amxx
